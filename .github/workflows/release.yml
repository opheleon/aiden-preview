# Builds, signs, notarizes, and publishes the macOS app from a version tag.
#
#   v1.2.3         -> GitHub Release (stable installs update to it)
#   v1.2.3-beta.1  -> GitHub pre-release (only beta installs update to it)
#
# Running it manually (Actions -> Release -> Run workflow) is a dry run: an unsigned build
# that is kept as a workflow artifact and never published.
#
# The build job runs project and dependency code with the signing secrets but cannot write to
# the repository. The publish job can write but runs no project code: it checksums, attests,
# and uploads exactly the files the build job produced.
name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-beta.[0-9]+'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    permissions:
      contents: read
      security-events: write
  build:
    needs: quality
    runs-on: macos-15
    timeout-minutes: 60
    env:
      RELEASE: ${{ github.event_name == 'push' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Check that the tag matches package.json
        if: env.RELEASE == 'true'
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - run: pnpm build

      - name: Package, sign, and notarize
        if: env.RELEASE == 'true'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # notarytool reads the App Store Connect key from a file. RUNNER_TEMP is deleted after the job.
          export APPLE_API_KEY="$RUNNER_TEMP/apple-api-key.p8"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$APPLE_API_KEY"
          pnpm exec electron-builder --mac --arm64 --publish never

      - name: Verify signature and notarization
        if: env.RELEASE == 'true'
        run: |
          app=release/mac/mac-arm64/Aiden.app
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"

      - name: Package unsigned (dry run)
        if: env.RELEASE != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --mac --arm64 --publish never -c.mac.notarize=false

      - name: Test the packaged application
        run: pnpm test:package:mac

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: packaged-app-failure
          path: test-results/desktop-smoke/
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos
          if-no-files-found: error
          retention-days: 7
          path: |
            release/mac/*.dmg
            release/mac/*.zip
            release/mac/*.blockmap
            release/mac/*-mac.yml

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # create the GitHub Release
      id-token: write # sign the provenance attestation with Sigstore
      attestations: write # store the attestation on GitHub
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos
          path: release

      - name: Write SHA-256 checksums
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: release/SHA256SUMS.txt

      - name: Publish GitHub Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh uploads every file to a draft and publishes it last, so updaters never see a partial release.
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            "${prerelease[@]}" \
            "$GITHUB_REF_NAME" *
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
