name: Packaged desktop
on:
  workflow_call:
permissions:
  contents: read
jobs:
  packaged:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: --mac zip --arm64 -c.mac.notarize=false
          - os: windows-2025
            target: --win --x64
          - os: ubuntu-24.04
            target: --linux AppImage --x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Install Linux display and browser dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libsecret-1-0
          pnpm exec playwright install-deps chromium
      - run: pnpm build
      - run: pnpm browser:prepare
      - name: Build the distributable
        env:
          PACKAGE_TARGET: ${{ matrix.target }}
        run: pnpm exec electron-builder $PACKAGE_TARGET --publish never
      - name: Install Windows app in an isolated directory
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem release/win/*.exe
          if ($installer.Count -ne 1) { throw 'Expected exactly one installer' }
          $destination = Join-Path $pwd 'release/win/installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$destination" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited $($process.ExitCode)" }
          if (!(Test-Path "$destination/Aiden.exe")) { throw 'Installed app is missing' }
      - name: Extract Linux app and enable its Chromium sandbox
        if: runner.os == 'Linux'
        working-directory: release/linux
        run: |
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract > /dev/null
          sudo chown root:root squashfs-root/chrome-sandbox
          sudo chmod 4755 squashfs-root/chrome-sandbox
      - name: Test packaged setup, login, restart, updates, and cleanup
        if: runner.os != 'Linux'
        run: pnpm test:package
      - name: Test packaged journeys on a virtual Linux display
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum pnpm test:package
      - name: Save screenshots, traces, and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: packaged-evidence-${{ matrix.os }}
          path: |
            test-results/
            playwright-report/
          retention-days: 14
