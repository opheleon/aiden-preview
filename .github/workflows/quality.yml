name: Quality
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install verification browser and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/
          retention-days: 14
  desktop:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec install-electron
      - name: Install verification browser
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: desktop-failure-evidence
          path: |
            test-results/
            playwright-report/
          retention-days: 14
  linux-worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Build the Linux Teams worker image
        run: docker build -t aiden-teams-worker .
      - name: Start the worker and check that it waits for a Teams sign-in
        run: |
          docker run -d --init --name aiden-worker -v aiden-data:/data aiden-teams-worker
          for attempt in $(seq 1 30); do
            docker exec aiden-worker aiden-teams status > status.txt 2>&1 && grep -q 'signed out' status.txt && break
            sleep 2
          done
          cat status.txt
          grep -q 'signed out' status.txt
          docker exec aiden-worker sh -c 'git --version && gh --version && claude --version'
          docker exec aiden-worker sh -c 'test -d "$PLAYWRIGHT_BROWSERS_PATH"'
          docker stop -t 30 aiden-worker
          test "$(docker inspect aiden-worker --format '{{.State.ExitCode}}')" = 0
      - name: Show worker logs
        if: always()
        run: docker logs aiden-worker || true
  packaged:
    uses: ./.github/workflows/packaged-desktop.yml
  security:
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write
  quality:
    if: always()
    needs: [checks, desktop, linux-worker, packaged, security]
    runs-on: ubuntu-latest
    steps:
      - name: Require every quality job
        env:
          CHECKS: ${{ needs.checks.result }}
          DESKTOP: ${{ needs.desktop.result }}
          LINUX_WORKER: ${{ needs.linux-worker.result }}
          PACKAGED: ${{ needs.packaged.result }}
          SECURITY: ${{ needs.security.result }}
        run: test "$CHECKS" = success && test "$DESKTOP" = success && test "$LINUX_WORKER" = success && test "$PACKAGED" = success && test "$SECURITY" = success
