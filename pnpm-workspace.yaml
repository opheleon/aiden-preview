packages:
  - apps/*
  - packages/*
nodeLinker: hoisted
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
verifyDepsBeforeRun: error
allowBuilds:
  esbuild@0.25.12: false
  esbuild@0.28.2: false
  electron-winstaller@5.4.0: false
# Legacy semver branch: 2023-07-10 release; SHA-512 matches the pre-migration lock.
# Required by Babel; no newer 6.x exists. See docs/dependency-security.md.
trustPolicyExclude:
  - semver@6.3.1
  - semver@5.7.2
# Security floors for transitive advisories (2026-10-24). Each selector matches only
# the vulnerable range and pins the lowest patched release older than the cooldown.
# See docs/dependency-security.md.
overrides:
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'hono@<4.13.11': 4.13.11
  'http-cache-semantics@<4.3.0': 4.3.0
  'ip-address@<10.7.1': 10.7.1
  'proxy-addr@<2.0.8': 2.0.8
  'smol-toml@<1.9.0': 1.9.0
  'source-map-js@<1.2.2': 1.2.2
