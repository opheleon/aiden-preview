packages:
  - apps/*
  - packages/*
nodeLinker: hoisted
minimumReleaseAge: 20160
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Temporary exact-version cooldown exceptions for security fixes, approved by
# Christian Ciabattoni on 2026-10-24. Each entry is removable on the date shown,
# once the release clears the 14-day cooldown. See docs/dependency-security.md.
minimumReleaseAgeExclude:
  - zod@4.6.6 # remove 2026-10-26
  - ip-address@10.7.4 # remove 2026-10-26
  - qs@6.16.1 # remove 2026-10-29
  - undici@6.29.1 # remove 2026-10-30
  - undici@7.30.1 # remove 2026-10-30
  - vitest@4.1.12 # remove 2026-10-30
  - '@vitest/coverage-v8@4.1.12' # remove 2026-10-30
  - '@vitest/expect@4.1.12' # remove 2026-10-30
  - '@vitest/mocker@4.1.12' # remove 2026-10-30
  - '@vitest/pretty-format@4.1.12' # remove 2026-10-30
  - '@vitest/runner@4.1.12' # remove 2026-10-30
  - '@vitest/snapshot@4.1.12' # remove 2026-10-30
  - '@vitest/spy@4.1.12' # remove 2026-10-30
  - '@vitest/utils@4.1.12' # remove 2026-10-30
  - fast-uri@3.1.9 # remove 2026-11-03
  - electron@44.9.1 # remove 2026-11-04
  - body-parser@2.4.0 # remove 2026-11-06
trustPolicy: no-downgrade
trustLockfile: false
blockExoticSubdeps: true
strictDepBuilds: true
verifyDepsBeforeRun: error
allowBuilds:
  esbuild@0.25.12: false
  esbuild@0.28.2: false
  electron-winstaller@5.4.0: false
# Legacy semver branch: 2023-07-10 release; SHA-512 matches the pre-migration lock.
# Required by Babel; no newer 6.x exists. See docs/dependency-security.md.
trustPolicyExclude:
  - semver@6.3.1
  - semver@5.7.2
# Security floors for transitive advisories (2026-10-24). Each selector matches only
# the vulnerable range and pins the lowest patched release older than the cooldown.
# See docs/dependency-security.md.
overrides:
  'brace-expansion@<1.1.21': 1.1.21
  'brace-expansion@>=2.0.0 <2.1.7': 2.1.7
  'brace-expansion@>=4.0.0 <5.0.12': 5.0.12
  'body-parser@>=2.0.0 <2.4.0': 2.4.0
  'fast-uri@>=3.0.0 <3.1.9': 3.1.9
  'hono@<4.13.11': 4.13.11
  'http-cache-semantics@<4.3.0': 4.3.0
  'ip-address@<10.7.4': 10.7.4
  'proxy-addr@<2.0.8': 2.0.8
  'smol-toml@<1.9.0': 1.9.0
  'source-map-js@<1.2.2': 1.2.2
  'undici@>=6.5.0 <6.29.1': 6.29.1
  'undici@>=7.0.0 <7.30.1': 7.30.1
